name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install leetcode-export
        run: pip install leetcode-export

      - name: Download LeetCode solutions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: |
          mkdir -p solutions
          leetcode-export --cookies "$LEETCODE_SESSION" --folder solutions/ --only-accepted --only-last-submission

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solutions/
          git diff --cached --quiet || git commit -m "Sync LeetCode solutions"
          git push
